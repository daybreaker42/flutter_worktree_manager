name: flutter_worktree_manager
description: A CLI tool to manage Flutter git worktrees with automatic secret file copying and build_runner support.
version: 0.1.0
repository: https://github.com/daybreaker42/flutter_worktree_manager

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  yaml: ^3.1.2
  path: ^1.9.0

executables:
  ftree: ftree # 유저가 'dart run ftree'로 호출 가능